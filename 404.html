<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Skynologix</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060f1d">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .error-message {
      font-size: 1.5rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      max-width: 600px;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>

<body>

  <!-- Cursor Following Glow -->
  <div class="hero-cursor-glow" id="cursor-glow"></div>

  <section class="hero" style="min-height:100vh">
    <div class="hero-bg">
      <img src="assets/hero-bg.jpg" alt="" loading="eager">
      <div class="hero-overlay"></div>
      <div class="mesh-pattern hero-mesh"></div>
    </div>

    <div class="error-container">
      <div class="glass-card reveal active" style="padding: 3rem; border-radius: 2rem;">
        <h1 class="error-code">404</h1>
        
        <div style="margin-bottom: 2rem;">
          <h2 style="color: var(--text-primary); margin-bottom: 0.5rem;">Page Not Found</h2>
          <p class="error-message" style="font-size: 1rem; margin-bottom: 1.5rem;">The page you are looking for doesn't exist or has been moved.</p>
          
          <div style="height: 1px; background: var(--border-color); margin: 1.5rem 0;"></div>

          <h2 style="color: var(--text-primary); margin-bottom: 0.5rem; font-family: var(--font-arabic);">الصفحة غير موجودة</h2>
          <p class="error-message" style="font-size: 1rem; font-family: var(--font-arabic);">الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
        </div>

        <div class="error-actions">
          <a href="index.html" class="btn-primary">
            <span>Back to Home</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </a>
          <a href="ar/index.html" class="btn-outline" style="font-family: var(--font-arabic);">
            <span>العودة للرئيسية</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/app.js" defer></script>
</body>
</html>
